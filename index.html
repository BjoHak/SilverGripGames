<!DOCTYPE html>
<html lang="en">
<head>

    <title>Silver Grip Games</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <a href="#" class="logo">
            <img src="img/Logo_Small_2048x2048_No_BGpng.png" alt="Silver Grip Games">

        <nav>
            <a href="#main">MAIN</a>
            <a href="#games">GAMES</a>
